[package]
name = "wasm-stress"
version = "0.1.1"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Document", "HtmlElement", "HtmlInputElement", 
    "HtmlTextAreaElement", "HtmlSelectElement", "Event",
    "Request", "RequestInit", "RequestMode", "Response", "Headers", "Performance",
    "AbortController", "AbortSignal", "RequestRedirect", "WebSocket", "BinaryType"
] }
wasm-bindgen-futures = "0.4"
futures = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-wasm-bindgen = "0.6"
regex = "1.10"
hdrhistogram = "7.3"
console_error_panic_hook = "0.1.7"
thiserror = "1.0"
gloo-timers = { version = "0.2", features = ["futures"] }
