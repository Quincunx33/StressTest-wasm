[package]
name = "stress-wasm"
version = "0.1.0"
edition = "2021"
description = "Rust/WASM HTTP, WebSocket and distributed load-testing engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
hdrhistogram = "=7.5.4"
wasm-bindgen = "=0.2.92"
wasm-bindgen-futures = "=0.4.42"
js-sys = "=0.3.69"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
regex = "1"
wasm-bindgen-test = "0.3"
web-sys = { version = "=0.3.69", features = ["Window", "Performance", "Worker", "Request", "RequestInit", "RequestMode", "RequestRedirect", "Response", "Headers", "AbortController", "AbortSignal", "WebSocket", "BinaryType"] }
gloo-timers = { version = "0.3", features = ["futures"] }
