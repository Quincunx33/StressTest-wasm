<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">WASM Stress Test performance dashboard illustration</title>
  <desc id="desc">A dark performance dashboard showing requests, latency, throughput, and a response-time chart.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#172554"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#818cf8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1400" height="760" rx="28" fill="url(#bg)"/>
  <rect x="44" y="38" width="1312" height="684" rx="22" fill="#0f172a" stroke="#334155"/>
  <text x="82" y="92" fill="#f8fafc" font-family="Arial, sans-serif" font-size="29" font-weight="700">WASM Stress Test</text>
  <text x="82" y="122" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">Browser-native performance monitoring</text>
  <rect x="1082" y="68" width="220" height="42" rx="21" fill="#123b50" stroke="#22d3ee"/>
  <circle cx="1110" cy="89" r="7" fill="#34d399"/><text x="1130" y="96" fill="#a7f3d0" font-family="Arial, sans-serif" font-size="16">TEST RUNNING</text>
  <g filter="url(#shadow)">
    <rect x="82" y="158" width="286" height="126" rx="16" fill="#172033" stroke="#293952"/>
    <rect x="390" y="158" width="286" height="126" rx="16" fill="#172033" stroke="#293952"/>
    <rect x="698" y="158" width="286" height="126" rx="16" fill="#172033" stroke="#293952"/>
    <rect x="1006" y="158" width="296" height="126" rx="16" fill="#172033" stroke="#293952"/>
  </g>
  <g font-family="Arial, sans-serif">
    <text x="108" y="192" fill="#94a3b8" font-size="15">TOTAL REQUESTS</text><text x="108" y="246" fill="#f8fafc" font-size="40" font-weight="700">7,547</text><text x="282" y="246" fill="#34d399" font-size="15">+12.4%</text>
    <text x="416" y="192" fill="#94a3b8" font-size="15">SUCCESS RATE</text><text x="416" y="246" fill="#34d399" font-size="40" font-weight="700">98.7%</text><text x="590" y="246" fill="#64748b" font-size="15">2xx</text>
    <text x="724" y="192" fill="#94a3b8" font-size="15">AVG LATENCY</text><text x="724" y="246" fill="#f8fafc" font-size="40" font-weight="700">25.6</text><text x="900" y="246" fill="#94a3b8" font-size="15">ms</text>
    <text x="1032" y="192" fill="#94a3b8" font-size="15">THROUGHPUT</text><text x="1032" y="246" fill="#67e8f9" font-size="40" font-weight="700">110</text><text x="1194" y="246" fill="#94a3b8" font-size="15">req/s</text>
  </g>
  <rect x="82" y="316" width="870" height="356" rx="18" fill="#121c2e" stroke="#293952"/>
  <text x="112" y="356" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Response time over test run</text>
  <text x="112" y="382" fill="#64748b" font-family="Arial, sans-serif" font-size="14">p50, p95 and p99 latency · milliseconds</text>
  <g stroke="#26364e" stroke-width="1"><path d="M112 430H920M112 490H920M112 550H920M112 610H920"/></g>
  <g fill="#64748b" font-family="Arial, sans-serif" font-size="12"><text x="112" y="642">0s</text><text x="305" y="642">10s</text><text x="510" y="642">20s</text><text x="714" y="642">30s</text><text x="890" y="642">40s</text></g>
  <path d="M112 520 C170 490 198 515 250 480 S340 500 392 450 S490 470 545 430 S645 462 700 415 S805 440 920 390" fill="none" stroke="#22d3ee" stroke-width="5"/>
  <path d="M112 565 C180 540 220 560 270 530 S370 552 425 505 S530 530 590 480 S700 515 760 460 S850 480 920 445" fill="none" stroke="#818cf8" stroke-width="4"/>
  <path d="M112 600 C200 580 235 590 290 570 S390 585 450 550 S550 570 610 530 S715 560 770 515 S860 540 920 500" fill="none" stroke="#f59e0b" stroke-width="3" stroke-dasharray="8 8"/>
  <g font-family="Arial, sans-serif" font-size="13"><circle cx="708" cy="356" r="5" fill="#22d3ee"/><text x="720" y="361" fill="#cbd5e1">p50</text><circle cx="770" cy="356" r="5" fill="#818cf8"/><text x="782" y="361" fill="#cbd5e1">p95</text><circle cx="834" cy="356" r="5" fill="#f59e0b"/><text x="846" y="361" fill="#cbd5e1">p99</text></g>
  <rect x="980" y="316" width="322" height="356" rx="18" fill="#121c2e" stroke="#293952"/>
  <text x="1010" y="356" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">Runtime health</text>
  <g font-family="Arial, sans-serif"><text x="1010" y="405" fill="#94a3b8" font-size="14">WASM VERSION</text><text x="1010" y="431" fill="#e2e8f0" font-size="18">v1.0.0</text><text x="1010" y="482" fill="#94a3b8" font-size="14">CONCURRENCY</text><text x="1010" y="508" fill="#67e8f9" font-size="30" font-weight="700">32</text><text x="1138" y="508" fill="#64748b" font-size="14">workers</text><text x="1010" y="559" fill="#94a3b8" font-size="14">ERROR BREAKDOWN</text><rect x="1010" y="580" width="240" height="13" rx="6" fill="#1e293b"/><rect x="1010" y="580" width="211" height="13" rx="6" fill="url(#accent)"/><text x="1010" y="625" fill="#34d399" font-size="16">Healthy endpoint</text><circle cx="1234" cy="620" r="7" fill="#34d399"/></g>
</svg>
